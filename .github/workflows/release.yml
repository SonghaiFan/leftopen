name: Release LeftOpen

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Swift tests
        run: swift test

      - name: Build macOS Application
        run: |
          chmod +x Scripts/build-app.sh
          LEFTOPEN_OUTPUT_DIR=dist/release Scripts/build-app.sh

      - name: Package Release Zip
        run: |
          ditto -c -k --keepParent dist/release/LeftOpen.app LeftOpen.zip
          shasum -a 256 LeftOpen.zip > LeftOpen.zip.sha256
          cat LeftOpen.zip.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LeftOpen.zip
            LeftOpen.zip.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
