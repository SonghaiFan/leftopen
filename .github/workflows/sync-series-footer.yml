name: Sync series footer
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-series-footer.yml
permissions:
  contents: write
concurrency:
  group: series-footer-sync
  cancel-in-progress: false
jobs:
  sync:
    uses: SonghaiFan/SonghaiFan/.github/workflows/sync-series-footer.yml@main
    with:
      series: franklin
